<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Elsheikh Store</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Cairo', sans-serif; background:#f8f9fa; }
</style>
</head>

<body class="min-h-screen bg-gray-50 pb-24">

<!-- ================= NAV ================= -->
<div class="fixed bottom-0 w-full bg-white border-t flex justify-around py-3 z-30 text-gray-400 text-xs font-bold shadow">
<button onclick="switchView('home')" class="flex flex-col items-center gap-1 text-[#4b5f28]">🏠 الرئيسية</button>
<button onclick="checkLoginAndAction('wishlist')" class="flex flex-col items-center gap-1">❤️ المفضلة</button>
<button onclick="checkLoginAndAction('orders')" class="flex flex-col items-center gap-1">📦 طلباتي</button>
<button onclick="openProfileEdit()" class="flex flex-col items-center gap-1">👤 حسابي</button>
</div>

<!-- ================= HOME ================= -->
<div id="view-home" class="max-w-md mx-auto p-4">
<h1 class="text-xl font-black mb-4">مرحباً 👋 <span id="header-username">زائر</span></h1>

<div class="space-y-4">
<button onclick="openCategoryPage('رجالي')" class="w-full bg-black text-white p-4 rounded-xl">رجالي</button>
<button onclick="openCategoryPage('حريمي')" class="w-full bg-gray-700 text-white p-4 rounded-xl">حريمي</button>
<button onclick="openCategoryPage('أطفالي')" class="w-full bg-gray-500 text-white p-4 rounded-xl">أطفالي</button>
</div>
</div>

<!-- ================= CATEGORY ================= -->
<div id="view-category" class="hidden max-w-md mx-auto p-4">
<button onclick="switchView('home')" class="mb-4 text-sm text-gray-500">⬅ رجوع</button>
<h2 id="cat-page-title" class="text-xl font-black mb-4"></h2>
<div id="products-grid" class="grid grid-cols-2 gap-3"></div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
<div class="bg-white w-full max-w-sm rounded-2xl p-6">
<h3 class="text-lg font-bold mb-4 text-center">تسجيل الدخول</h3>
<form onsubmit="handleLogin(event)" class="space-y-3">
<input type="tel" id="l-phone" class="w-full p-3 border rounded-xl" placeholder="رقم الهاتف" required>
<div id="new-user-fields" class="hidden space-y-3">
<input id="l-name" class="w-full p-3 border rounded-xl" placeholder="الاسم">
<input id="l-address" class="w-full p-3 border rounded-xl" placeholder="العنوان">
</div>
<button type="submit" id="l-btn" class="w-full py-3 bg-[#4b5f28] text-white rounded-xl">متابعة</button>
</form>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyASO-AN5XaSGn4SaCZ8VlHr6zsFCIxPCzs",
  authDomain: "ahmed-shoes.firebaseapp.com",
  projectId: "ahmed-shoes",
  storageBucket: "ahmed-shoes.firebasestorage.app",
  messagingSenderId: "172928088473",
  appId: "1:172928088473:web:100f543fd097a8d5c33b08",
  measurementId: "G-S50TX0VMKE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.currentUser = JSON.parse(localStorage.getItem("userData")) || null;
window.products = [];

async function init() {

const grid = document.getElementById('products-grid');
grid.innerHTML = `
<div class="col-span-2 text-center py-20">
<div class="w-10 h-10 border-4 border-[#4b5f28] border-t-transparent rounded-full animate-spin mx-auto"></div>
<p class="mt-3 font-bold text-gray-500">جاري تحميل المنتجات...</p>
</div>`;

try {

if(window.currentUser){
const userRef = doc(db,"users",window.currentUser.phone);
const snap = await getDoc(userRef);
if(snap.exists()){
window.currentUser = snap.data();
localStorage.setItem("userData",JSON.stringify(window.currentUser));
document.getElementById('header-username').innerText =
window.currentUser.name.split(' ')[0];
}else{
localStorage.removeItem("userData");
window.currentUser = null;
}
}

const q = query(collection(db,"products"),orderBy("timestamp","desc"));
const snap = await getDocs(q);
window.products = snap.docs.map(d=>({id:d.id,...d.data()}));

} catch(e){ console.log(e); }

}
init();

window.switchView = (v)=>{
document.getElementById('view-home').classList.add('hidden');
document.getElementById('view-category').classList.add('hidden');
document.getElementById('view-'+v).classList.remove('hidden');
}

window.openCategoryPage = (cat)=>{
document.getElementById('cat-page-title').innerText = cat;
switchView('category');

if(!window.products.length){
document.getElementById('products-grid').innerHTML =
'<p class="col-span-2 text-center py-10">لا توجد منتجات</p>';
return;
}

const filtered = window.products.filter(p=>p.category===cat);
renderGrid(filtered);
}

function renderGrid(items){
const grid = document.getElementById('products-grid');
if(!items.length){
grid.innerHTML = '<p class="col-span-2 text-center py-10">لا يوجد منتجات في هذا القسم</p>';
return;
}

grid.innerHTML = items.map(p=>`
<div class="bg-white p-3 rounded-xl shadow">
<img src="${p.images[0]}" class="w-full h-32 object-cover rounded">
<h4 class="font-bold mt-2">${p.name}</h4>
<p class="text-[#4b5f28] font-black">${p.price} ج.م</p>
</div>`).join('');
}

window.checkLoginAndAction = (act)=>{
if(!window.currentUser){
document.getElementById('login-modal').classList.remove('hidden');
return;
}
alert("تم تسجيل الدخول بالفعل");
}

window.handleLogin = async (e)=>{
e.preventDefault();
const ph = document.getElementById('l-phone').value.trim();
const btn = document.getElementById('l-btn');

if(!/^01[0-9]{9}$/.test(ph)){
alert("رقم غير صحيح");
return;
}

btn.disabled = true;

const ref = doc(db,"users",ph);
const snap = await getDoc(ref);

if(snap.exists()){
finishLogin(snap.data());
}else{
document.getElementById('new-user-fields').classList.remove('hidden');
btn.innerText="تسجيل";
btn.onclick = async ()=>{
const name = document.getElementById('l-name').value;
const address = document.getElementById('l-address').value;
await setDoc(ref,{name,phone:ph,address,wishlist:[]});
finishLogin({name,phone:ph,address,wishlist:[]});
}
}
}

async function finishLogin(u){
localStorage.setItem("userData",JSON.stringify(u));
window.currentUser = u;
document.getElementById('header-username').innerText =
u.name.split(' ')[0];
document.getElementById('login-modal').classList.add('hidden');
}

</script>
</body>
</html>
